services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: motorsense_timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: motorsense_db
      POSTGRES_USER: motorsense_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - motorsense_pgdata:/var/lib/postgresql/data

volumes:
  motorsense_pgdata:
