{% extends "base.html" %}
{% block title %}Log in · MotorSense IoT{% endblock %}
{% block body %}
  <main class="auth" id="main">
    <section class="card auth-card" aria-labelledby="login-title">
      <h1 id="login-title">MotorSense IoT</h1>
      <p class="muted">EQ-001 · Bench rig, 4 DC motors</p>
      {% if messages %}
        {% for message in messages %}
          <p class="notice {% if message.tags == 'error' %}error{% endif %}" role="alert" style="margin-top: var(--space-4)">{{ message }}</p>
        {% endfor %}
      {% endif %}
      <form method="post" class="auth-form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn">Log in</button>
      </form>
    </section>
  </main>
{% endblock %}
